<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - About Me</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .site-wrapper {
      max-width: 750px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 16px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #F3EEDA;
    }

    .top-banner h1 { 
      font-size: 2.2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .back-home-btn {
      background: #F3EEDA;
      color: #111;
      border: 2px solid #111;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.75rem;
      text-decoration: none;
      box-shadow: 2px 2px 0px #111;
      transition: transform 0.1s ease;
    }
    .back-home-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #111; }

    .profile-card-main {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 4px 4px 0px #111111;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .profile-pic {
      width: 140px;
      height: 140px;
      background: #eee;
      border: 2px solid #111;
      border-radius: 20px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 3px 3px 0px #111;
    }

    .profile-header-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-header-info h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .tag {
      background: #F3EEDA;
      border: 2px solid #111;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      box-shadow: 2px 2px 0px #111;
    }

    /* Sezione Pulsanti Social in basso */
    .social-buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
      padding-top: 20px;
      border-top: 2px dashed #ddd;
    }

    .social-btn {
      width: 50px;
      height: 50px;
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0px #111111;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
    }

    .social-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #111111;
    }

    .social-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px #111111;
    }

    .social-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Stile per il pulsante vuoto di Neocities */
    .social-btn-empty {
      background: #F3EEDA;
      font-size: 0.65rem;
      font-weight: 800;
      color: #111;
      text-align: center;
      padding: 4px;
    }

    @media screen and (max-width: 600px) {
      .profile-card-main {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .tags-row {
        justify-content: center;
      }
      .top-banner h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>ABOUT ME</h1>
      <a href="https://cosmic-seea.neocities.org/" class="back-home-btn">&lt;- HOME</a>
    </header>

    <div class="profile-card-main">
      <img src="https://via.placeholder.com/200x200/111/fff?text=Seea" alt="Profile Picture" class="profile-pic">
      
      <div class="profile-header-info">
        <h2>Seea <span style="font-weight: 600; font-size: 1.1rem; color: #666;">(Seea Star)</span></h2>
        
        <div class="tags-row">
          <span class="tag">Female</span>
          <span class="tag">December 21</span>
          <span class="tag">Sagittarius</span>
          <span class="tag">INTP</span>
        </div>
      </div>
    </div>

    <!-- Pulsanti Social in basso -->
    <div class="social-buttons-container">
      <!-- Email -->
      <a href="mailto:seea-star@proton.me" class="social-btn" title="Email">
        <img src="URL_IMMAGINE_EMAIL" alt="Email">
      </a>

      <!-- Pinterest -->
      <a href="#" class="social-btn" title="Pinterest">
        <img src="URL_IMMAGINE_PINTEREST" alt="Pinterest">
      </a>

      <!-- YouTube -->
      <a href="#" class="social-btn" title="YouTube">
        <img src="URL_IMMAGINE_YOUTUBE" alt="YouTube">
      </a>

      <!-- Instagram -->
      <a href="#" class="social-btn" title="Instagram">
        <img src="URL_IMMAGINE_INSTAGRAM" alt="Instagram">
      </a>

      <!-- TikTok -->
      <a href="#" class="social-btn" title="TikTok">
        <img src="URL_IMMAGINE_TIKTOK" alt="TikTok">
      </a>

      <!-- Neocities (Pulsante vuoto temporaneo) -->
      <a href="https://neocities.org/site/cosmic-seea" class="social-btn social-btn-empty" title="Neocities Profile">
        NEO
      </a>
    </div>

  </div>

</body>
</html>
